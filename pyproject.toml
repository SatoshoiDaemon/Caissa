[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-web"
version = "0.1.0"
description = "A local real-time multiplayer chess prototype"
requires-python = ">=3.10"
dependencies = [
  "Flask==2.3.3",
  "Werkzeug==2.3.7",
  "Flask-CORS==4.0.0",
  "Flask-SocketIO==5.3.4",
  "python-socketio==5.9.0",
  "python-engineio==4.14.0",
  "python-dotenv==1.0.0",
  "argon2-cffi>=23.1,<26",
  "pymongo>=4.6,<5",
  "redis>=5,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "black>=24,<26",
  "bandit>=1.7,<2",
  "mongomock>=4.1,<5",
  "fakeredis>=2.24,<3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires MongoDB and Redis services",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.bandit]
exclude_dirs = ["tests"]
